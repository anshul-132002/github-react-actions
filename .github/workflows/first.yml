name : "first workflow"
on : 
    push :
    pull_request : 
      branches : 
        - main
jobs :
  first-job :
    runs-on : "ubuntu-latest"
    steps :
      - name : checkout
        uses : actions/checkout@v4
        with :
           node-version : 24
           cache : npm
      
      - name : "install dependencies"
        run : npm ci

      - name : "Check ESLint"
        run : npm run lint

      - name : "make react build"
        run : npm run build